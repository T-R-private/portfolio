<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var BASE = "/portfolio"; // ← リポ名に合わせる
        var l = window.location;

        // BASE を取り除いた元のパス + 検索 + ハッシュを連結
        var path = l.pathname.startsWith(BASE)
          ? l.pathname.slice(BASE.length)
          : l.pathname;
        var redir = encodeURIComponent(
          path + (l.search || "") + (l.hash || "")
        );

        // 404→必ずルートへ戻す（200が返る場所）＋元URLを __gh_redirect に積む
        l.replace(BASE + "/?__gh_redirect=" + redir);
      })();
    </script>
    <noscript
      >JavaScript が必要です。<a href="/portfolio/">トップへ</a></noscript
    >
  </head>
  <body></body>
</html>
