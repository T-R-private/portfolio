<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>404 Not Found</title>
    <script>
      // GitHub Pages SPA redirect - 確実なリダイレクト版
      (function () {
        var l = window.location;
        var pathname = l.pathname;

        // 既にリダイレクト処理が実行されている場合は何もしない
        if (sessionStorage.getItem("redirecting")) {
          sessionStorage.removeItem("redirecting");
          return;
        }

        // リダイレクト処理開始をマーク
        sessionStorage.setItem("redirecting", "true");

        // ベースパスを除去
        var basePath = "/portfolio";
        var cleanPath = pathname;

        if (pathname.startsWith(basePath)) {
          cleanPath = pathname.substring(basePath.length);
        }

        // クエリパラメータやハッシュを除去
        cleanPath = cleanPath.split("?")[0].split("#")[0];

        // 有効なルートパスかチェック
        var validRoutes = [
          "",
          "/",
          "/experience",
          "/projects",
          "/books",
          "/hobbies",
        ];

        // ルートパスまたは空の場合は、ベースパスにリダイレクト
        if (!cleanPath || cleanPath === "/") {
          window.location.replace(basePath + "/");
        } else if (validRoutes.includes(cleanPath)) {
          // 有効なルートの場合は、ベースパス + パスにリダイレクト
          window.location.replace(basePath + cleanPath);
        } else {
          // 無効なルートの場合は、ホームにリダイレクト
          window.location.replace(basePath + "/");
        }
      })();
    </script>
  </head>
  <body>
    <h1>404 Not Found</h1>
    <p>ページが見つかりません。自動的に適切なページへリダイレクトします。</p>
  </body>
</html>
