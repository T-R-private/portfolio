<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <script>
      // GitHub Pages SPA redirect - 確実版
      (function () {
        const loc = window.location;
        const pathname = loc.pathname;

        console.log("404.html - Pathname:", pathname);

        // /portfolio/ 以降のパスを取得
        if (pathname.startsWith("/portfolio/")) {
          const route = pathname.substring("/portfolio/".length);
          console.log("404.html - Route:", route);

          // 有効なルートかチェック
          const validRoutes = ["experience", "projects", "books", "hobbies"];
          if (validRoutes.includes(route)) {
            console.log("404.html - Valid route, redirecting");
            // クエリパラメータ付きでリダイレクト
            const url =
              loc.origin + "/portfolio/?p=" + encodeURIComponent(route);
            console.log("404.html - Redirect URL:", url);
            window.location.replace(url);
          } else {
            console.log("404.html - Invalid route, going home");
            window.location.replace(loc.origin + "/portfolio/");
          }
        } else {
          console.log("404.html - Not portfolio path, going home");
          window.location.replace(loc.origin + "/portfolio/");
        }
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>ページをリダイレクトしています...</p>
  </body>
</html>
