<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <script>
      // GitHub Pages SPA redirect for portfolio
      (function () {
        const loc = window.location;
        const origin = loc.origin; //=> https://t-r-private.github.io
        const path = loc.href.substr(origin.length + 1); //=> portfolio/projects

        // portfolio/ 以降のパスを取得
        if (path.startsWith("portfolio/")) {
          const route = path.substring("portfolio/".length); //=> projects
          const url = origin + "/portfolio/?p=" + encodeURIComponent(route);
          loc.replace(url);
        } else {
          // portfolio/ で始まらない場合は、portfolio/ にリダイレクト
          loc.replace(origin + "/portfolio/");
        }
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>ページをリダイレクトしています...</p>
  </body>
</html>
