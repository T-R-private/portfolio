<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // あなたのプロジェクトのベースパス（リポジトリ名）に合わせて
        var BASE = "/portfolio";

        var l = window.location;

        // /portfolio 以降のパスを取り出す（例: "/experience"）
        var path = l.pathname.startsWith(BASE)
          ? l.pathname.slice(BASE.length)
          : l.pathname;

        // 末尾の / はそのまま扱ってOK（ルーターが解決）
        var search = l.search || "";
        var hash = l.hash || "";

        // ルートに一度戻し、元のURIをクエリに積む
        // 例: /portfolio/?__gh_redirect=/experience
        var url =
          BASE + "/?__gh_redirect=" + encodeURIComponent(path + search + hash);

        // 履歴を汚さないよう replace
        l.replace(url);
      })();
    </script>
    <noscript
      >JavaScript が必要です。<a href="/portfolio/"
        >/portfolio/ に戻る</a
      ></noscript
    >
  </head>
  <body></body>
</html>
